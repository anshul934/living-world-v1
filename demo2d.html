<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#132b24" />
    <title>LIVING WORLD — Interactive Forest Demo</title>
  </head>
  <body>
    <div id="demo-app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <div>
            <div class="eyebrow">LIVING WORLD</div>
            <h1>A forest that notices you</h1>
          </div>
        </div>
      </header>
      <main>
        <section class="scene-panel" aria-label="Interactive forest">
          <div class="canvas-wrap">
            <canvas id="forest-canvas" aria-label="Interactive 2D forest. Move visitors gently and watch the wildlife respond."></canvas>
          </div>
        </section>
      </main>
      <footer class="bottom-note"><span class="bottom-pulse"></span> Be curious, not hurried. Give the forest a moment to respond.</footer>
    </div>
    <div id="camera-preview-container">
      <video id="webcam-video" autoplay playsinline muted></video>
      <span id="camera-status">Camera: Offline</span>
    </div>
    <script type="module" src="/src/demo2d.js"></script>
  </body>
</html>
